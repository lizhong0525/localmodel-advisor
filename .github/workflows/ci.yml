name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI
        run: python -m localmodel_advisor estimate --vram 12 --ram 32 --params 7 --quant q4_k_m --context 4096 --backend llama.cpp --no-benchmarks
